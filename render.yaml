services:
  - type: web
    name: search-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    envVars:
      - key: X402_ENABLED
        value: "false"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: X402_PRICE_SEARCH_WEB_USDC
        value: "0.025"
      - key: X402_PRICE_FETCH_URL_USDC
        value: "0.01"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      # BILLING_DB_PATH points at the persistent disk mount below. Set explicitly:
      # Render does not remove env vars deleted from render.yaml, so omitting it
      # would leave the live service pinned to the old ./data/subscribers.db path.
      - key: BILLING_DB_PATH
        value: "/var/lib/search-mcp/billing.db"
      # Anonymous free tier: monthly credit bucket per client IP, keyed off
      # the same x402 price map as subscribers. 50 credits = $0.50 of
      # list-price calls (Scott's call — tune FREE_MONTHLY_CREDITS).
      # FREE_TIER_ENABLED=false kills the free path (straight to 402).
      - key: FREE_TIER_ENABLED
        value: "true"
      - key: FREE_MONTHLY_CREDITS
        value: "50"
      # ADMIN_KEY gates GET /billing/stats (usage analytics). Scott must set
      # this in the Render dashboard to a long random string — the endpoint
      # 401s until it is set.
      - key: ADMIN_KEY
        sync: false
      - key: RATE_LIMIT
        value: "60/minute"
      - key: SEARCH_API_KEY
        sync: false
    # Persistent disk (1 GB = $0.25/mo) so the SQLite subscriber store
    # survives redeploys. Without it, Render's ephemeral filesystem wipes
    # paid subscriber keys on every deploy. Added via the service's Disk
    # page in the dashboard — see PR body for the exact clicks.
    disk:
      name: search-mcp-data
      mountPath: /var/lib/search-mcp
      sizeGB: 1
