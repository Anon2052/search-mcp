services:
  - type: web
    name: search-mcp
    runtime: image
    image:
      url: docker.io/ioconnex/search-mcp:20261121a
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    envVars:
      - key: X402_ENABLED
        value: "true"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: X402_PRICE_SEARCH_WEB_USDC
        value: "0.01"
      - key: X402_PRICE_FETCH_URL_USDC
        value: "0.01"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      # BILLING_DB_PATH is intentionally NOT set here: the code default points
      # at the persistent disk mount below (single source of truth). Override
      # per-environment in the dashboard if ever needed.
      - key: RATE_LIMIT
        value: "60/minute"
      - key: SEARCH_API_KEY
        sync: false
    # Persistent disk (1 GB = $0.25/mo) so the SQLite subscriber store
    # survives redeploys. Without it, Render's ephemeral filesystem wipes
    # paid subscriber keys on every deploy. Added via the service's Disk
    # page in the dashboard — see PR body for the exact clicks.
    disk:
      name: search-mcp-data
      mountPath: /var/lib/search-mcp
      sizeGB: 1
