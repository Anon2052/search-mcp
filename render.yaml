services:
  - type: web
    name: search-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    envVars:
      - key: X402_ENABLED
        value: "false"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: X402_PRICE_SEARCH_WEB_USDC
        value: "0.025"
      - key: X402_PRICE_FETCH_URL_USDC
        value: "0.01"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: BILLING_DB_PATH
        value: "./data/subscribers.db"
      - key: RATE_LIMIT
        value: "60/minute"
      - key: SEARCH_API_KEY
        sync: false
